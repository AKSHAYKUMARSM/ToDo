<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>TO-Do</title>
</head>
<body>
    <div class="title"><h class="box title" id="title">My Title</h></div>
    
    <div class="box main">
        <div class="bar">
            <button type="button" id="load">load</button>
            <P id="counter">Tasks: 0 Comppleted: 0</P>
            <button type="button" id="save">Save</button>
        </div>
        <div class="createTask box">
            <textarea name="newTask" id="newTask" placeholder="Add a Task"></textarea>
            <button type="button" id="addTask">+</button>
        </div>
        <div class="box" id="taskContainer">
           
        </div>
        
        <button type="button" id="clear">Clear All</button>
        
        
    </div>
</body>
<script src="main.js"></script>
</html>
